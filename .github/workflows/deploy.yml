name: Exercice 3 — Secrets et sécurité de l'image

on:
  push:
    branches: [main, 'exo-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for sensitive patterns
        run: |
          echo "Recherche de secrets en clair dans le dépôt..."
          SENSITIVE=$(grep -RInE --exclude-dir=.git --exclude-dir=docs --exclude='*.md' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' '(API_KEY|authtoken|password|secret|SECRET|TOKEN)[[:space:]]*[:=]' . | grep -v '{{ secrets\.' | grep -v 'secrets\.' || true)
          if [ -n "$SENSITIVE" ]; then
            echo "Secrets ou valeurs sensibles détectés :"
            echo "$SENSITIVE"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run lint
        run: |
          python3 -m ruff check .

      - name: Run tests
        run: |
          python3 -m pytest -q

  security:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for security scan
        run: |
          docker build --pull -t flask-app:security .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin latest
          trivy --version

      - name: Scan container image for CRITICAL CVEs
        env:
          TRIVY_DISABLE_VEX_NOTICE: '1'
        run: |
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed flask-app:security

  build-push:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ngrok:
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${OWNER}/${REPO}"
          IMAGE_TAG="${{ github.sha }}"

          echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Pull Docker image from GHCR
        run: |
          docker pull "${IMAGE_URL}:sha-${IMAGE_TAG:0:7}"
          docker tag "${IMAGE_URL}:sha-${IMAGE_TAG:0:7}" flask-app:latest

      - name: Install jq and Ngrok
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz -C /tmp

      - name: Create Ngrok tunnel & Wait 120s
        run: |
          /tmp/ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}" --config /tmp/ngrok.yml
          echo "Démarrage du tunnel Ngrok..."
          /tmp/ngrok http 5000 --config /tmp/ngrok.yml --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          if [ "$NGROK_URL" = "null" ] || [ -z "$NGROK_URL" ]; then
            echo "❌ Erreur critique : Impossible de récupérer l'URL Ngrok."
            echo "=== LOGS NGROK ==="
            cat /tmp/ngrok.log
            exit 1
          fi
          echo "=========================================================="
          echo "🚀 APPLICATION FLASK DISPONIBLE EN LIGNE :"
          echo "🔗 URL : ${NGROK_URL}"
          echo "=========================================================="
          echo "### 🚀 URL de Démo éphémère (Active 2 min)" >> $GITHUB_STEP_SUMMARY
          echo "L'application a été déployée avec succès." >> $GITHUB_STEP_SUMMARY
          echo "- **Lien public** : [${NGROK_URL}](${NGROK_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Temps restant** : Le tunnel s'arrêtera automatiquement à la fin du step." >> $GITHUB_STEP_SUMMARY
          echo "⏳ Compte à rebour de 120 secondes démarré. Vous pouvez tester le lien..."
          sleep 120
          echo "🛑 Temps écoulé ! Fermeture propre du tunnel."
          kill $(pgrep ngrok) || true
